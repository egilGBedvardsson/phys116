<p>
  Beats oppstår når to sinussignaler med nesten lik frekvens legges sammen.
</p>
<p class="doc-eq">\[
x(t)=A\sin(2\pi f_1t)+A\sin(2\pi f_2t)
\]</p>
<p>
  Rødt viser amplitudeomslaget \(\pm 2A|\cos(\pi(f_2-f_1)t)|\).
  Beat-frekvensen er \(|f_2-f_1|\). Sporet viser de siste 4 sekundene av simulert tid, med nåtiden til venstre.
</p>
