<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beats</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/demos/beats.css">

  <script src="../assets/js/demo-utils.js" defer></script>
  <script src="../assets/js/demos/beats.js" defer></script>
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">
    <section id="controls">

      <div class="control">
        <div class="row">
          <label for="deltaRange">
            Frekvensforskjell Δf
          </label>

          <span
            id="deltaVal"
            class="value"
          ></span>
        </div>

        <input
          id="deltaRange"
          class="slider"
          type="range"
          min="0"
          max="4"
          step="0.1"
          value="1"
        >
      </div>


      <div class="control">
        <div class="row">
          <label for="speedRange">
            Hastighet
          </label>

          <span
            id="speedVal"
            class="value"
          ></span>
        </div>

        <input
          id="speedRange"
          class="slider"
          type="range"
          min="0.2"
          max="2"
          step="0.1"
          value="1"
        >
      </div>

    </section>

    <div class="demo-actions">
      <button id="pauseBtn" type="button" aria-pressed="false">Pause</button>
      <button id="resetBtn" type="button">Start på nytt</button>
    </div>
    <canvas id="plot" role="img" aria-label="To sinussignaler med amplitudeomslag" aria-describedby="plotDescription">Summen av to sinussignaler med rødt amplitudeomslag.</canvas>
    <p id="plotDescription" class="sr-only">Summen av to sinussignaler med rødt amplitudeomslag.</p>
    <p id="signalReadout" class="demo-readout" aria-live="polite"></p>

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="UiB-logo"
      >
      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
