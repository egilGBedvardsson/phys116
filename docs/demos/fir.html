<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FIR-filterdemo</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/demos/fir.css">

  <script src="../assets/js/demo-utils.js" defer></script>
  <script src="../assets/js/demos/fir.js" defer></script>
</head>

<body class="demo-page">
 <section id="controls">

  <!-- Signal ------------------------------------------------------------- -->

  <div class="control">
    <div class="row">
      <label for="signalType">Signal</label>
    </div>

    <select id="signalType">
      <option value="tone">Tone</option>
      <option value="twoTone" selected>To toner</option>
      <option value="square">Firkant</option>
      <option value="chirp">Chirp</option>
      <option value="impulse">Impuls</option>
      <option value="noise">Støy</option>
    </select>
  </div>


  <div class="control">
    <div class="row">
      <label for="f1">Frekvens 1</label>
      <span id="f1Val" class="value"></span>
    </div>

    <input
      id="f1"
      class="slider"
      type="range"
      min="5"
      max="90"
      step="1"
      value="10"
    >
  </div>


  <div class="control">
    <div class="row">
      <label for="f2">Frekvens 2</label>
      <span id="f2Val" class="value"></span>
    </div>

    <input
      id="f2"
      class="slider"
      type="range"
      min="10"
      max="110"
      step="1"
      value="50"
    >
  </div>


  <div class="control">
    <div class="row">
      <label for="noise">Støy</label>
      <span id="noiseVal" class="value"></span>
    </div>

    <input
      id="noise"
      class="slider"
      type="range"
      min="0"
      max="0.6"
      step="0.01"
      value="0"
    >
  </div>


  <!-- Filter ------------------------------------------------------------- -->

  <div class="control">
    <div class="row">
      <label for="filterType">Filter</label>
    </div>

    <select id="filterType">
      <option value="none">Ingen</option>
      <option value="moving-average">Running average</option>
      <option value="lowpass" selected>Lavpass</option>
      <option value="highpass">Høypass</option>
      <option value="bandpass">Båndpass</option>
      <option value="notch">Notch</option>
    </select>
  </div>


    <!-- Filter parameter ---------------------------------------------------- -->

    <div id="filterParameterControl" class="control">

      <!-- Low-pass / high-pass / notch -->

      <div id="cutoffControl" class="filter-parameter">
        <div class="row">
          <label id="cutoffLabel" for="cutoff">
            Grensefrekvens
          </label>

          <span id="cutoffVal" class="value"></span>
        </div>

        <input
          id="cutoff"
          class="slider"
          type="range"
          min="5"
          max="100"
          step="1"
          value="25"
        >
      </div>


      <!-- Band-pass -->

      <div
        id="bandControl"
        class="filter-parameter"
        hidden
      >
        <div class="row">
          <label for="bandLow">
            Båndpass
          </label>

          <span class="value">
            <span id="bandLowVal"></span>–<span id="bandHighVal"></span>
          </span>
        </div>

        <div class="band-sliders">
          <input
            id="bandLow"
            class="slider"
            type="range"
            min="5"
            max="90"
            step="1"
            value="20"
            aria-label="Nedre grense"
          >

          <input
            id="bandHigh"
            class="slider"
            type="range"
            min="10"
            max="110"
            step="1"
            value="60"
            aria-label="Øvre grense"
          >
        </div>
      </div>


      <!-- Moving average -->

      <div
        id="movingAverageControl"
        class="filter-parameter"
        hidden
      >
        <div class="row">
          <label for="movingAverageLength">
            Vinduslengde
          </label>

          <span
            id="movingAverageLengthVal"
            class="value"
          ></span>
        </div>

        <input
          id="movingAverageLength"
          class="slider"
          type="range"
          min="3"
          max="31"
          step="2"
          value="9"
        >
      </div>

    </div>

  <!-- FIR parameters ----------------------------------------------------- -->

  <div class="control">
    <div class="row">
      <label for="kernelLength">
        Kernel-lengde
      </label>

      <span
        id="kernelLengthVal"
        class="value"
      ></span>
    </div>

    <input
      id="kernelLength"
      class="slider"
      type="range"
      min="5"
      max="81"
      step="2"
      value="31"
    >
  </div>


  <div class="control">
    <div class="row">
      <label for="passes">
        Antall konvolusjoner
      </label>

      <span
        id="passesVal"
        class="value"
      ></span>
    </div>

    <input
      id="passes"
      class="slider"
      type="range"
      min="1"
      max="3"
      step="1"
      value="1"
    >
  </div>

</section>

    <section id="output">

      <canvas
        id="outputCanvas"
        width="1200"
        height="360"
      ></canvas>

      <div id="plotLegend">
        Inngang x[n] (grå) + utgang y[n] (svart)
      </div>

      <div id="subplots">

        <canvas
          id="impulseCanvas"
          width="590"
          height="220"
        ></canvas>

        <canvas
          id="responseCanvas"
          width="590"
          height="220"
        ></canvas>

      </div>

    </section>

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="University logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
