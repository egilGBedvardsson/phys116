<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Firkantsignal og konjugatsymmetri</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link
    rel="stylesheet"
    href="../assets/css/demos/firkantsignal-konjugatsymmetri.css"
  >

  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <script src="../assets/js/demo-utils.js" defer></script>
  <script
    src="../assets/js/demos/firkantsignal-konjugatsymmetri.js"
    defer
  ></script>
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="University logo"
      >
      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

    <section id="controls">

      <div class="control">
        <div class="row">
          <label for="phiSlider">\(\phi\)</label>
          <span id="phiVal" class="value"></span>
        </div>

        <input
          id="phiSlider"
          class="slider"
          type="range"
          min="-3.14"
          max="3.14"
          step="0.05"
          value="0"
        >
      </div>

      <div class="control">
        <div class="row">
          <label for="nSlider">\(N\)</label>
          <span id="nVal" class="value"></span>
        </div>

        <input
          id="nSlider"
          class="slider"
          type="range"
          min="1"
          max="40"
          step="1"
          value="15"
        >
      </div>

    </section>

    <div id="plot"></div>

  </div>
</body>
</html>
