<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Fourier-rekker</title>

  <link rel="stylesheet" href="../assets/css/design.css?v=20261118-standardized-demos">
  <link rel="stylesheet" href="../assets/css/demo.css?v=20261118-standardized-demos">
  <link rel="stylesheet" href="../assets/css/demos/fourier-series.css?v=20261118-standardized-demos">

  <script src="../assets/js/demo-utils.js?v=20261118-standardized-demos" defer></script>
  <script src="../assets/js/demos/fourier-series.js?v=20261118-standardized-demos" defer></script>
  
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">

    <section id="controls">

      <div class="control">
        <div class="row">
          <label for="shapeSelect">Målkurve</label>
          <span class="value"></span>
        </div>

        <select id="shapeSelect">
          <option value="square">Firkant</option>
          <option value="sawtooth">Sagtann</option>
          <option value="triangle">Trekant</option>
        </select>
      </div>

      <div class="control">
        <div class="row">
          <label for="termsRange">Antall ledd N</label>
          <span id="termsVal" class="value"></span>
        </div>

        <input
          id="termsRange"
          class="slider"
          type="range"
          min="1"
          max="25"
          step="1"
          value="9"
        >
      </div>

      <div class="control">
        <div class="row">
          <label for="speedRange">Hastighet</label>
          <span id="speedVal" class="value"></span>
        </div>

        <input
          id="speedRange"
          class="slider"
          type="range"
          min="0.2"
          max="3"
          step="0.1"
          value="1"
        >
      </div>

    </section>

    <div class="demo-actions">
      <button id="pauseBtn" type="button" aria-pressed="false">Pause</button>
      <button id="resetBtn" type="button">Start på nytt</button>
    </div>
    <div id="plotHost" class="canvas-host">
      <canvas id="plot" role="img" aria-label="Fourier-rekke med roterende harmoniske bidrag" aria-describedby="plotDescription">Roterende harmoniske bidrag og summen av dem som en periodisk kurve.</canvas>
    </div>
    <p id="plotDescription" class="sr-only">Roterende harmoniske bidrag og summen av dem som en periodisk kurve.</p>
    <p id="signalReadout" class="demo-readout" aria-live="polite"></p>

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="UiB-logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
