<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Fourier-rekker</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/demos/fourier-series.css">

  <script src="../assets/js/demo-utils.js" defer></script>
  <script src="../assets/js/demos/fourier-series.js" defer></script>
  
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">

    <section id="controls">

      <div class="control">
        <div class="row">
          <label for="shapeSelect">Målkurve</label>
          <span class="value"></span>
        </div>

        <select id="shapeSelect">
          <option value="square">Firkant</option>
          <option value="sawtooth">Sagtann</option>
          <option value="triangle">Trekant</option>
        </select>
      </div>

      <div class="control">
        <div class="row">
          <label for="termsRange">Antall harmonier</label>
          <span id="termsVal" class="value"></span>
        </div>

        <input
          id="termsRange"
          class="slider"
          type="range"
          min="1"
          max="25"
          step="2"
          value="9"
        >
      </div>

      <div class="control">
        <div class="row">
          <label for="speedRange">Hastighet</label>
          <span id="speedVal" class="value"></span>
        </div>

        <input
          id="speedRange"
          class="slider"
          type="range"
          min="0.2"
          max="3"
          step="0.1"
          value="1"
        >
      </div>

    </section>

    <canvas id="plot"></canvas>

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="University logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
