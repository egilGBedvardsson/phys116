<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../assets/design.css">
<style>
:root {
  --line: #d9d9d9;
  --text: #111111;
}

#container {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

#controls {
  width: 100%;
  padding: 18px 0 16px;
  box-sizing: border-box;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: repeat(3, minmax(170px, 1fr));
  gap: 12px;
  align-items: end;
}

.control {
  min-width: 0;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}

label {
  font-size: 14px;
  font-weight: 600;
}

#plot {
  width: 100%;
  min-height: 660px;
  margin-top: 12px;
  border: 1px solid var(--line);
  background: var(--theme-surface-bg, #ffffff);
  display: block;
}

@media (max-width: 860px) {
  #controls {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">
    <section id="controls">
      <div class="control">
        <div class="row"><label for="shapeSelect">Målkurve</label><span class="value"></span></div>
        <select id="shapeSelect">
          <option value="square">Firkant</option>
          <option value="sawtooth">Sagtann</option>
          <option value="triangle">Trekant</option>
        </select>
      </div>

      <div class="control">
        <div class="row"><label for="termsRange">Antall harmonier</label><span id="termsVal" class="value"></span></div>
        <input id="termsRange" class="slider" type="range" min="1" max="25" step="2" value="9" />
      </div>

      <div class="control">
        <div class="row"><label for="speedRange">Hastighet</label><span id="speedVal" class="value"></span></div>
        <input id="speedRange" class="slider" type="range" min="0.2" max="3" step="0.1" value="1" />
      </div>
    </section>

    <canvas id="plot"></canvas>

    <div id="top-banner" class="demo-footer">
      <img class="demo-footer-logo" src="../assets/UiB_PositivEmblem.png" alt="University logo" />
      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>
  </div>

  <script>
    const plot = document.getElementById("plot");
    const shapeSelect = document.getElementById("shapeSelect");
    const termsRange = document.getElementById("termsRange");
    const speedRange = document.getElementById("speedRange");
    const termsVal = document.getElementById("termsVal");
    const speedVal = document.getElementById("speedVal");
    const ctx = plot.getContext("2d");
    const themeSurfaceBg = getComputedStyle(document.documentElement).getPropertyValue("--theme-surface-bg").trim() || "#ffffff";

    let width = 0;
    let height = 0;
    let dpr = window.devicePixelRatio || 1;
    let time = 0;
    const waveform = [];
    const MAX_WAVEFORM = 760;

    function updateReadouts() {
      termsVal.textContent = `${termsRange.value}`;
      speedVal.textContent = Number(speedRange.value).toFixed(1);
    }

    function resizeCanvas() {
      width = plot.clientWidth;
      height = Math.max(540, plot.clientHeight);
      plot.width = Math.max(1, Math.floor(width * dpr));
      plot.height = Math.max(1, Math.floor(height * dpr));
      plot.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function getCoefficients(shape, count) {
      const coefs = [];
      const baseRadius = Math.min(width, height) * 0.18;
      for (let i = 0; i < count; i += 1) {
        let n;
        let amp;
        let phase = 0;

        if (shape === "square") {
          n = 2 * i + 1;
          amp = (4 / (Math.PI * n)) * baseRadius;
        } else if (shape === "sawtooth") {
          n = i + 1;
          amp = (2 / (Math.PI * n)) * baseRadius;
          phase = n % 2 === 0 ? Math.PI : 0;
        } else {
          n = 2 * i + 1;
          amp = (8 / (Math.PI * Math.PI * n * n)) * baseRadius;
          phase = ((i % 2) === 0) ? 0 : Math.PI;
        }

        coefs.push({ freq: n, amp, phase });
      }
      return coefs;
    }

    function drawNestedCircles() {
      const step = Number(speedRange.value);
      const shape = shapeSelect.value;
      const harmonics = Number(termsRange.value);
      const coefs = getCoefficients(shape, harmonics);
      const origin = { x: width * 0.28, y: height * 0.52 };
      let x = origin.x;
      let y = origin.y;

      ctx.strokeStyle = "#cfcfcf";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(origin.x, 0);
      ctx.lineTo(origin.x, height);
      ctx.stroke();

      ctx.fillStyle = "#222";
      ctx.font = "14px sans-serif";
      ctx.fillText("Epicykel-konstruksjon", 20, 26);
      ctx.fillText("Sporet viser summen av harmoniske rotasjoner.", 20, 46);

      for (const coef of coefs) {
        const angle = coef.freq * time * step + coef.phase;
        const nextX = x + coef.amp * Math.cos(angle);
        const nextY = y + coef.amp * Math.sin(angle);

        ctx.strokeStyle = "rgba(95, 112, 209, 0.55)";
        ctx.beginPath();
        ctx.arc(x, y, Math.abs(coef.amp), 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#3b4cc0";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(nextX, nextY);
        ctx.stroke();

        x = nextX;
        y = nextY;
      }

      const signalOffset = origin.y;
      const scaledSignal = y - signalOffset;
      waveform.unshift(scaledSignal);
      if (waveform.length > MAX_WAVEFORM) waveform.pop();

      const graphX = width * 0.52;
      const graphWidth = width - graphX - 24;
      const graphCenterY = origin.y;
      const sampleSpacing = graphWidth / (MAX_WAVEFORM - 1);

      ctx.strokeStyle = "#bbb";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.rect(graphX, 24, graphWidth, height - 56);
      ctx.stroke();

      ctx.strokeStyle = "rgba(34, 34, 34, 0.35)";
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(graphX, y);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "#222";
      ctx.fillText("Waveform", graphX + 12, 40);
      ctx.fillText(`Målkurve: ${shape === "square" ? "Firkant" : shape === "sawtooth" ? "Sagtenn" : "Triangel"}`, graphX + 12, 62);
      ctx.fillText(`Harmonier: ${harmonics}`, graphX + 12, 84);
      ctx.fillText(`Hastighet: ${step.toFixed(1)}x`, graphX + 12, 106);
      ctx.fillText("Tid →", graphX + graphWidth - 40, height - 16);

      ctx.strokeStyle = "#999";
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(graphX, graphCenterY);
      ctx.lineTo(graphX + graphWidth, graphCenterY);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.strokeStyle = "#d11141";
      ctx.lineWidth = 2;
      ctx.beginPath();
      waveform.forEach((value, index) => {
        const xPos = graphX + index * sampleSpacing;
        const yPos = graphCenterY + value;
        if (index === 0) {
          ctx.moveTo(xPos, yPos);
        } else {
          ctx.lineTo(xPos, yPos);
        }
      });
      ctx.stroke();

      if (waveform.length > 0) {
        const currentX = graphX;
        const currentY = graphCenterY + waveform[0];
        ctx.fillStyle = "#d11141";
        ctx.beginPath();
        ctx.arc(currentX, currentY, 5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "#d11141";
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    function animate() {
      resizeCanvas();
      ctx.fillStyle = themeSurfaceBg;
      ctx.fillRect(0, 0, width, height);
      drawNestedCircles();
      time += 0.01;
      requestAnimationFrame(animate);
    }

    function init() {
      updateReadouts();
      resizeCanvas();
      shapeSelect.addEventListener("change", updateReadouts);
      termsRange.addEventListener("input", updateReadouts);
      speedRange.addEventListener("input", updateReadouts);
      window.addEventListener("resize", resizeCanvas);
      animate();
    }

    init();
  </script>
</body>
</html>
