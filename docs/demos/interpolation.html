<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Interpolasjon</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/demos/interpolation.css?v=20261118-compact-demos">

  <script src="../assets/js/demo-utils.js" defer></script>
  <script src="../assets/js/demos/interpolation.js?v=20261118-compact-demos" defer></script>
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">

    <section id="controls">

      <div class="control">
        <div class="row">
          <label for="methodSelect">
            Interpoleringsmetode
          </label>
        </div>

        <select id="methodSelect">
          <option value="nearest">Nærmeste nabo</option>
          <option value="cosine">Cosinus</option>
          <option value="triangle">Lineær (trekantkjerne)</option>
          <option value="sinc">Sinc</option>
        </select>
      </div>

      <p class="hint">
        Flytt markøren i figuren, eller fokuser figuren og bruk piltastene.
      </p>

    </section>

    <svg
      id="plot"
      viewBox="0 0 900 520"
      role="img"
      tabindex="0"
      aria-label="Interpolasjon. Bruk venstre og høyre piltast for å flytte markøren."
      aria-describedby="probeReadout"
    ></svg>

    <p id="probeReadout" class="demo-readout" aria-live="polite"></p>
    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="UiB-logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
