<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Interpolasjon</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/demos/interpolation.css">

  <script src="../assets/js/demo-utils.js" defer></script>
  <script src="../assets/js/demos/interpolation.js" defer></script>
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">

    <section id="controls">

      <div class="control">
        <div class="row">
          <label for="methodSelect">
            Interpoleringsmetode
          </label>
        </div>

        <select id="methodSelect">
          <option value="nearest">Nærmeste nabol</option>
          <option value="cosine">Cosinus</option>
          <option value="triangle">Trekant</option>
          <option value="sinc">Sinc</option>
        </select>
      </div>

      <p class="hint">
        Velg metode for å se hvordan verdiene mellom punktene blir tilnærmet.
      </p>

    </section>

    <svg
      id="plot"
      viewBox="0 0 900 520"
      role="img"
      aria-label="Interpolasjon"
    ></svg>

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="University logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
