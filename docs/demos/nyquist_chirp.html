<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sampling og Nyquist</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/demos/nyquist-chirp.css">

  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

  <script src="../assets/js/demo-utils.js" defer></script>
  <script src="../assets/js/demos/nyquist-chirp.js" defer></script>
</head>

<body class="demo-page">
  <div id="container" class="demo-shell">

    <section id="controls">
      <div class="control">
        <div class="row">
          <label for="fsSlider">
            Samplingfrekvens (fs)
          </label>

          <span id="fsVal" class="value"></span>
        </div>

        <input
          id="fsSlider"
          class="slider"
          type="range"
          min="2"
          max="80"
          step="1"
          value="30"
        >
      </div>
    </section>

    <div id="plot"></div>

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="University logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
