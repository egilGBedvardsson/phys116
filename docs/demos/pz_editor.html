<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Poler og nuller</title>

  <link rel="stylesheet" href="../assets/css/design.css?v=20261118-standardized-demos">
  <link rel="stylesheet" href="../assets/css/demo.css?v=20261118-standardized-demos">
  <link rel="stylesheet" href="../assets/css/demos/pz-editor.css?v=20261118-standardized-demos">

  <script src="../assets/js/demo-utils.js?v=20261118-standardized-demos" defer></script>
  <script src="../assets/js/demos/pz-editor.js?v=20261118-standardized-demos" defer></script>
</head>

<body class="demo-page">
  <div id="page" class="demo-shell filter-demo">

    <section id="controls">

      <div class="control">
        <label for="modeSelect">Verktøy</label>

        <select id="modeSelect">
          <option value="add-zero">Legg til null</option>
          <option value="add-pole">Legg til pol</option>
          <option value="delete">Slett punkt</option>
        </select>
      </div>

      <div class="control control-conjugate">
        <label>Konjugatpar</label>

        <label class="check-wrap">
          <input
            id="conjToggle"
            type="checkbox"
            checked
          >
          Auto-par ved innsetting
        </label>
      </div>

      <div class="control">
        <label>Operasjoner</label>

        <button
          id="removeSelectedBtn"
          type="button"
        >
          Fjern valgt
        </button>
      </div>

      <div class="control">
        <label>Preset</label>

        <button
          id="presetLowBtn"
          type="button"
        >
          Lavpass-eksempel
        </button>
      </div>

      <div class="control">
        <label>Tilbakestill</label>

        <button
          id="clearBtn"
          type="button"
        >
          Tilbakestill diagram
        </button>
      </div>

    </section>

    <details class="numeric-editor">
      <summary>Rediger punkter med tastatur</summary>
      <div class="numeric-fields">
        <label>Valgt punkt<select id="pointSelect"><option value="">Ingen</option></select></label>
        <label>Type ved innsetting<select id="pointType"><option value="zero">Null</option><option value="pole">Pol</option></select></label>
        <label>Reell del<input id="pointReal" type="number" min="-1.4" max="1.4" step="any" required value="0.5"></label>
        <label>Imaginær del<input id="pointImaginary" type="number" min="-1.4" max="1.4" step="any" required value="0"></label>
        <button id="addNumericPoint" type="button">Legg til</button>
        <button id="moveNumericPoint" type="button">Flytt valgt</button>
      </div>
    </details>
    <p id="status" aria-live="polite"></p>

    <section id="layout">

      <article class="panel">
        <h3>Poler og nuller i z-planet</h3>
        <div id="pzPlot" class="canvas-host">
          <canvas id="pzCanvas" role="img" aria-describedby="status">Poler og nuller i z-planet. Bruk punkteditoren for tastaturbetjening.</canvas>
        </div>
      </article>

      <article id="plots">

        <section class="plot-wrap">
          <h4>
            Magnituderespons (K = 1), |H(e<sup>jω</sup>)| i dB
          </h4>

          <div id="magnitudePlot" class="canvas-host response-plot">
            <canvas
              id="magCanvas" aria-label="Absolutt magnituderespons i dB"
              role="img" aria-describedby="status"
            ></canvas>
          </div>
        </section>

        <section class="plot-wrap">
          <h4>
            Faserespons ∠H(e<sup>jω</sup>) i rad
          </h4>

          <div id="phasePlot" class="canvas-host response-plot">
            <canvas
              id="phaseCanvas" aria-label="Utfoldet faserespons i radianer"
              role="img" aria-describedby="status"
            ></canvas>
          </div>
        </section>

      </article>

    </section>

    <p id="responseNote" class="demo-readout"></p>
    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="UiB-logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
