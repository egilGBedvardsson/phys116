<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Poler og nuller</title>

  <link rel="stylesheet" href="../assets/css/design.css">
  <link rel="stylesheet" href="../assets/css/demo.css">
  <link rel="stylesheet" href="../assets/css/demos/pz-editor.css">

  <script src="../assets/js/demo-utils.js" defer></script>
  <script src="../assets/js/demos/pz-editor.js" defer></script>
</head>

<body class="demo-page">
  <div id="page" class="demo-shell">

    <section id="controls">

      <div class="control">
        <label for="modeSelect">Verktøy</label>

        <select id="modeSelect">
          <option value="add-zero">Legg til null</option>
          <option value="add-pole">Legg til pol</option>
          <option value="delete">Slett punkt</option>
        </select>
      </div>

      <div class="control control-conjugate">
        <label>Konjugatpar</label>

        <label class="check-wrap">
          <input
            id="conjToggle"
            type="checkbox"
            checked
          >
          Auto-par ved innsetting
        </label>
      </div>

      <div class="control">
        <label>Operasjoner</label>

        <button
          id="removeSelectedBtn"
          type="button"
        >
          Fjern valgt
        </button>
      </div>

      <div class="control">
        <label>Preset</label>

        <button
          id="presetLowBtn"
          type="button"
        >
          Lavpass-eksempel
        </button>
      </div>

      <div class="control">
        <label>Tilbakestill</label>

        <button
          id="clearBtn"
          type="button"
        >
          Tilbakestill diagram
        </button>
      </div>

    </section>

    <p id="status"></p>

    <section id="layout">

      <article class="panel">
        <h3>Poler og nuller i z-planet</h3>
        <canvas id="pzCanvas"></canvas>
      </article>

      <article id="plots">

        <section class="plot-wrap">
          <h4>
            Magnituderespons |H(e<sup>jω</sup>)| i dB
          </h4>

          <canvas
            id="magCanvas"
            class="plot-canvas"
          ></canvas>
        </section>

        <section class="plot-wrap">
          <h4>
            Faserespons ∠H(e<sup>jω</sup>) i rad
          </h4>

          <canvas
            id="phaseCanvas"
            class="plot-canvas"
          ></canvas>
        </section>

      </article>

    </section>

    <div id="top-banner" class="demo-footer">
      <img
        class="demo-footer-logo"
        src="../assets/images/UiB_PositivEmblem.png"
        alt="University logo"
      >

      <span>Universitetet i Bergen</span>
      <span>PHYS 116</span>
    </div>

  </div>
</body>
</html>
