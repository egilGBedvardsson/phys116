<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PHYS 116 · Demoportal</title>

  <script>
    /*
     * Relative paths break if GitHub Pages serves this page as /docs
     * instead of /docs/. Normalize the URL before loading assets.
     */
    if (window.location.pathname.endsWith("/docs")) {
      window.location.replace(
        `${window.location.pathname}/${window.location.search}${window.location.hash}`
      );
    }
  </script>

  <link rel="stylesheet" href="./assets/css/design.css">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      },
      options: {
        skipHtmlTags: [
          "script",
          "noscript",
          "style",
          "textarea",
          "pre",
          "code"
        ]
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  ></script>

  <script
    defer
    src="./assets/js/portal.js"
  ></script>
</head>

<body class="portal-body">

  <main class="page">

    <section class="finder-window">

      <header class="window-bar">
        <div class="window-title-wrap">
          <h1 class="window-title">
            Signal og Systemanalyse
          </h1>
        </div>

        <p
          id="windowPath"
          class="window-path"
        >
          PHYS 116 / Hjem
        </p>
      </header>


      <div class="window-main">

        <!-- ===============================================================
             Sidebar
             =============================================================== -->

        <aside class="sidebar">

          <button
            class="sidebar-top sidebar-home-btn"
            type="button"
            data-demo="home"
            aria-label="Gå til hjem"
          >
            <img
              class="sidebar-logo"
              src="./assets/images/UiB_PositivEmblem.png"
              alt="UiB-logo"
            >

            <span>
              <span class="sidebar-school">
                Universitetet i Bergen
              </span>

              <span class="sidebar-course">
                Forside
              </span>
            </span>
          </button>

          <p class="sidebar-label">
            Innhold
          </p>

          <nav
            class="demo-list"
            aria-label="Demoliste"
          >
            <button
              class="demo-btn"
              type="button"
              data-demo="nyquist"
            >
              Nyquist

            </button>

                        <button
              class="demo-btn"
              type="button"
              data-demo="beats"
            >
              Beats
            </button>

            <button
              class="demo-btn"
              type="button"
              data-demo="firkantsignal"
            >
              Konjugatsymmetri

            </button>

            <button
              class="demo-btn"
              type="button"
              data-demo="fourier"
            >
              Fourier-serie
            </button>

            <button
              class="demo-btn"
              type="button"
              data-demo="interpolation"
            >
              Interpolasjon
            </button>

            <button
              class="demo-btn"
              type="button"
              data-demo="fir"
            >
              FIR-filter
            </button>

            <button
              class="demo-btn"
              type="button"
              data-demo="pz"
            >
              Pol-null
            </button>
          </nav>

        </aside>


        <!-- ===============================================================
             Reader
             =============================================================== -->

        <section class="reader">

          <div class="reader-toolbar">

            <p
              id="readerBreadcrumb"
              class="reader-breadcrumb"
            >
              Hjem
            </p>

            <a
              id="openExternal"
              class="open-link"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              hidden
            >
              Åpne demo i ny fane
            </a>

          </div>


          <article class="card">

            <header class="viewer-head">
              <h2
                id="viewerTitle"
                class="viewer-title"
              >
                Hjem
              </h2>
            </header>


            <div class="viewer-stage">

              <section class="stage-doc">
                <p class="doc-editor-label">
                  Dokumenttekst
                </p>

                <div
                  id="docContent"
                  class="doc-content"
                ></div>
              </section>


              <section class="stage-demo">

                <div
                  id="emptyState"
                  class="empty"
                ></div>

                <iframe
                  id="demoFrame"
                  title="Interaktiv demo"
                  scrolling="no"
                ></iframe>

              </section>

            </div>

          </article>

        </section>

      </div>

    </section>

  </main>


  <button
    id="toTopBtn"
    class="to-top-btn"
    type="button"
    aria-label="Til toppen"
  >
    Til toppen
  </button>

</body>
</html>
